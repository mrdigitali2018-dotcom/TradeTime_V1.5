name: Build Trade-time APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          if [ ! -f android-project.zip ]; then
            echo "::error::Upload android-project.zip to the repository root."
            exit 1
          fi

          project_dir="$RUNNER_TEMP/tradetime-android"
          mkdir -p "$project_dir"
          unzip -q android-project.zip -d "$project_dir"

          for file in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml; do
            if [ ! -f "$project_dir/$file" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-time-v1.3-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
